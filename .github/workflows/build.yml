name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload

          APP_PATH=$(find build/Build/Products/Release-iphoneos \
            -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app file found"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" Payload/

          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
